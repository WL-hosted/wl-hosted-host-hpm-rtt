# OpenOCD 总配置：聚合调试探针 / SoC / 板级配置
# 路径相对于本文件所在目录（仓库根目录），不依赖 openocd 启动时的工作目录

set script_dir [file dirname [info script]]

source [file join $script_dir board/debug_scripts/openocd/probes/cmsis_dap.cfg]
source [file join $script_dir board/debug_scripts/openocd/soc/hpm6360.cfg]
source [file join $script_dir board/debug_scripts/openocd/boards/hpm6364.cfg]

# 硬件只接了 TRST 未接 SRST：禁用硬件复位信号，halt 走 RISC-V Debug Module（软件 halt）
#reset_config none

# 当前 BL/App 都会启用 WDG0。CPU halt 不会停止外设看门狗，若它在
# XPI RAM 算法运行期间复位 SoC，OpenOCD 会报 auto_probe/algorithm timeout。
proc prepare_flash_programming {} {
    halt

    # HPM6360 WDG0: WREN @ +0x18, CTRL @ +0x10.
    # 使用 DMI system-bus access，与板级时钟初始化的访问方式保持一致。
    $::_TARGET0 riscv dmi_write 0x39 0xF0090018
    $::_TARGET0 riscv dmi_write 0x3C 0x00005AA5
    $::_TARGET0 riscv dmi_write 0x39 0xF0090010
    $::_TARGET0 riscv dmi_write 0x3C 0x00000000

    init_clock
}

# 单次 OpenOCD 进程内只执行一次。HPM XPI RAM 算法超时后会留下异常
# target/ROM 上下文，必须由外层脚本重启 OpenOCD 进程后再试。
proc program_image {image} {
    prepare_flash_programming
    flash write_image erase $image
    verify_image $image
    echo "Programming and verification succeeded"
    reset run
}
